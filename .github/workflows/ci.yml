name: CI

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 1200 cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      - name: Annotate test failures
        if: ${{ failure() }}
        run: python3 .github/scripts/annotate.py test test.log --tests

  # Builds below run only after clippy and the tests pass.
  server-image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/telehand-server
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-runner:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build
        run: cargo build --release -p telehand-runner
      - uses: actions/upload-artifact@v4
        with:
          name: telehand-runner-windows-x86_64
          path: target/release/telehand-runner.exe
