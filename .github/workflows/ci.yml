name: CI

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format
        run: |
          cargo fmt --all --check > fmt.diff 2>&1 || {
            python3 .github/scripts/annotate.py rustfmt fmt.diff
            exit 1
          }
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout 1200 cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      - name: Annotate test failures
        if: ${{ failure() }}
        run: python3 .github/scripts/annotate.py test test.log --tests
