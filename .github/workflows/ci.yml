name: 🧪 持续集成 (Continuous Integration)

on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: 🔍 检查与测试 (Check and Test)
    # The find tool passes --no-require-git, which needs fd >= 8.6; 22.04's apt has 8.3.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7
      - name: 安装 Rust 工具链 (Install Rust Toolchain)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: 运行 Clippy 检查 (Run Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The grep and find tools run ripgrep and fd; Ubuntu names fd `fdfind`.
      - name: 安装 ripgrep 和 fd (Install ripgrep and fd)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - name: 运行测试 (Run Tests)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --no-fail-fast

  # Builds below run only after clippy and the tests pass.
  server-image:
    name: 🐳 构建服务端镜像 (Build Server Image)
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7
      - name: 配置 Docker Buildx (Setup Docker Buildx)
        uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR (Login to GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像元数据 (Generate Image Metadata)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/telehand-server
          tags: |
            type=ref,event=branch
            type=sha
      - name: 构建并推送镜像 (Build and Push Image)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-runner:
    name: 🪟 构建 Windows Runner (Build Windows Runner)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v7
      # Warnings are already denied by the check job; don't fail the build on them.
      - name: 安装 Rust 工具链 (Install Rust Toolchain)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - name: 运行 build 构建 (Run Cargo Build)
        run: cargo build --release -p telehand-runner
      # archive: false uploads the bare exe instead of a zip; the artifact is
      # named after the file.
      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: target/release/telehand-runner.exe
          archive: false
